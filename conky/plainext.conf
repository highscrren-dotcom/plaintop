-- PlainExt для s1dPC — текстовый монитор в стиле Rainmeter-скина PlainExt.
-- Запуск под KDE Plasma 6 / KWin Wayland идёт через XWayland: own_window_type='desktop'
-- под KWin не работает, поэтому окно обычное, но снабжено подсказками below/skip_taskbar
-- и правилом KWin (см. cachyos/SETUP.md).
conky.config = {
    alignment = 'top_left',
    gap_x = 48,
    gap_y = 44,
    minimum_width = 430,
    maximum_width = 430,

    use_xft = true,
    font = 'JetBrainsMono Nerd Font Mono:size=10',
    override_utf8_locale = true,

    own_window = true,
    own_window_type = 'normal',
    -- Класс НЕ 'Conky': KWin сопоставляет этот класс с /usr/share/applications/conky.desktop
    -- из пакета и при восстановлении сессии запускает ЕГО (conky --daemonize --pause=1),
    -- а не нашу команду. Свой класс разрывает это сопоставление.
    own_window_class = 'conky-plainext',
    own_window_title = 'conky-plainext',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_colour = '#00000000',

    double_buffer = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    background = false,

    update_interval = 1.0,
    cpu_avg_samples = 4,
    net_avg_samples = 2,
    no_buffers = true,
    top_name_width = 16,

    default_color = 'C8CCD4',
    color1 = 'E05561',   -- акцент заголовка, как красный в PlainExt
    color2 = '6B7280',   -- приглушённый для второстепенного
    color3 = '8FB6E0',   -- значения

    lua_load = '~/.config/conky/plainext.lua',
}

conky.text = [[
${color1}s1dd1\Dashboard\s1dPC${color}
${voffset 8}${font JetBrainsMono Nerd Font Mono:bold:size=34}${time %H:%M}${font JetBrainsMono Nerd Font Mono:size=15}${color2}${time :%S}${color}${font}
${voffset 6}${color3}${time %A, %-d %B}${color}
${color2}CachyOS x86_64  ${kernel}${color}
${color2}-----------------------------------${color}
CPU ${color1}${lua bar cpu}${color} ${cpu cpu0}%
S0 ${color1}${lua sockbar 0}${color} ${lua sock 0}%   ${color2}node0${color}
S1 ${color1}${lua sockbar 1}${color} ${lua sock 1}%   ${color2}node1${color}
${color2}2x E5-2697 v4  36c/72t${color}  ${execi 3 sensors -u coretemp-isa-0000 2>/dev/null | awk '/temp1_input/{printf "%.0f",$2;exit}'}/${execi 3 sensors -u coretemp-isa-0001 2>/dev/null | awk '/temp1_input/{printf "%.0f",$2;exit}'}°C  ${execi 3 sensors -u nct6779-isa-0a20 2>/dev/null | awk '/fan1_input/{printf "%.0f",$2;exit}'}/${execi 3 sensors -u nct6779-isa-0a20 2>/dev/null | awk '/fan2_input/{printf "%.0f",$2;exit}'} rpm
${top name 1}${goto 230}| ${top cpu 1}%
${top name 2}${goto 230}| ${top cpu 2}%
${top name 3}${goto 230}| ${top cpu 3}%
${top name 4}${goto 230}| ${top cpu 4}%
${top name 5}${goto 230}| ${top cpu 5}%
${color2}-----------------------------------${color}
RAM ${color1}${lua bar mem}${color} ${memperc}%
${color2}${mem} / ${memmax}${color}
${top_mem name 1}${goto 230}| ${top_mem mem_res 1}
${top_mem name 2}${goto 230}| ${top_mem mem_res 2}
${top_mem name 3}${goto 230}| ${top_mem mem_res 3}
${top_mem name 4}${goto 230}| ${top_mem mem_res 4}
${top_mem name 5}${goto 230}| ${top_mem mem_res 5}
${color2}-----------------------------------${color}
GPU ${color1}${lua bar gpu}${color} ${execi 3 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null}%
${color2}VRAM${color} ${execi 3 nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader,nounits 2>/dev/null | awk -F', ' '{printf "%.1f/%.1f GB",$1/1024,$2/1024}'}  ${color2}temp${color} ${execi 3 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader 2>/dev/null}°C  ${color2}pwr${color} ${execi 3 nvidia-smi --query-gpu=power.draw --format=csv,noheader,nounits 2>/dev/null | awk '{printf "%.0f",$1}'}W
${color2}-----------------------------------${color}
/   ${color1}${lua bar root}${color} ${fs_used_perc /}%
${color2}F: ${fs_free /}  T: ${fs_size /}  R: ${diskio_read nvme0n1}  W: ${diskio_write nvme0n1}${color}
${color2}nvme${color} ${execi 5 sensors -u nvme-pci-0500 2>/dev/null | awk '/temp1_input/{printf "%.0f",$2;exit}'}°C${if_mounted /run/media/s1dd1/s1d}
s1d ${color1}${lua bar sata}${color} ${fs_used_perc /run/media/s1dd1/s1d}%
${color2}F: ${fs_free /run/media/s1dd1/s1d}  T: ${fs_size /run/media/s1dd1/s1d}  NTFS${color}${else}
${color2}s1d | не смонтирован${color}${endif}
${color2}-----------------------------------${color}
${uptime}
${color2}enp4s0${color}  Dl ${downspeed enp4s0}  Ul ${upspeed enp4s0}
${color2}-----------------------------------${color}
${execpi 15 @HOME@/.config/conky/services.sh}
${color2}-----------------------------------${color}
${color2}CPU |${color} 2x Intel Xeon E5-2697 v4
${color2}GPU |${color} NVIDIA RTX 2000 Ada Generation
${color2}MBD |${color} INTEL X99  (BIOS 5.11)
${color2}-----------------------------------${color}
]]
